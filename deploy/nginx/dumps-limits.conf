# Destino: /etc/nginx/conf.d/dumps-limits.conf (contexto http; nginx lo incluye solo)
# Zonas de límites y formato de log sin token para el vhost dumps.synkra.app.
# Autor: Jesús Montalvo · jmontalvo_m@outlook.com

# Peticiones y conexiones por IP: frena escaneo de tokens e inundaciones antes de llegar al gateway
limit_req_zone  $binary_remote_addr zone=dumps_req:10m  rate=5r/s;
limit_conn_zone $binary_remote_addr zone=dumps_conn:10m;

# El token del enlace es un secreto: el log de acceso solo guarda el prefijo /d/ y lo demás redactado
map $request_uri $dumps_safe_uri {
    "~^/d/[A-Za-z0-9_-]{6}"  "/d/<redactado>";
    default                $request_uri;
}

log_format dumps_safe '$remote_addr - [$time_local] "$request_method $dumps_safe_uri" '
                      '$status $body_bytes_sent "$http_user_agent"';
